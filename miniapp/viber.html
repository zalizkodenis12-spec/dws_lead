<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Перехід у Viber — DWS Lead</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #111111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85vh;
      text-align: center;
    }
    .card {
      max-width: 360px;
      width: 100%;
      padding: 28px 20px;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    .title {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .phone {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0066FF;
      margin-bottom: 14px;
    }
    .sub {
      font-size: 0.88rem;
      color: #6b7280;
      margin-bottom: 20px;
      line-height: 1.45;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      background: #0066FF;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .btn-sec {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      background: #ffffff;
      color: #0066FF;
      border: 1.5px solid #0066FF;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Відкриваємо чат у Viber</div>
    <div class="phone" id="phoneLabel"></div>
    <div class="sub">Текст пропозиції вже скопійовано у ваш буфер обміну. Натисніть кнопку нижче, якщо Viber не відкрився автоматично:</div>
    <a id="viberChatLink" href="#" class="btn">ВІДКРИТИ ЧАТ У VIBER</a>
    <a id="viberAddLink" href="#" class="btn-sec">ДОДАТИ КОНТАКТ У VIBER</a>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var raw = (params.get('num') || '').replace(/\D/g, '');
      if (raw.startsWith('0')) raw = '38' + raw;
      else if (raw.length === 9) raw = '380' + raw;
      if (!raw) raw = '380000000000';

      var phoneEl = document.getElementById('phoneLabel');
      if (phoneEl) phoneEl.textContent = '+' + raw;

      var chatUri = 'viber://chat?number=%2B' + raw;
      var addUri = 'viber://add?number=' + raw;

      var chatBtn = document.getElementById('viberChatLink');
      var addBtn = document.getElementById('viberAddLink');
      if (chatBtn) chatBtn.href = chatUri;
      if (addBtn) addBtn.href = addUri;

      setTimeout(function() {
        window.location.href = chatUri;
      }, 80);
    })();
  </script>
</body>
</html>
